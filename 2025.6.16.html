<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 센서 대시보드</title>
  <link rel="stylesheet" href="2025.6.16.css" />
  <!-- 아이콘 라이브러리 (Font Awesome) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="main-layout">
    <!-- 왼쪽 지역 필터 -->
    <div id="filterSidebar">
      <h3><i class="fa-solid fa-location-dot"></i> 지역 필터</h3>
      <select id="sidebarSido"></select>
      <select id="sidebarSigungu"></select>
      <select id="sidebarDong"></select>
      <button id="searchButton"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
      <div id="userList"></div>
    </div>

    <!--  센서 대시보드 -->
    <div style="flex: 1;">
      <h1>발패드 사용자 상태값</h1>
      <div id="currentDateTime" style="text-align:center;margin-bottom:20px;font-weight:bold;"></div>
      <div style="text-align:center;margin-bottom:20px;">
        <button id="enableAudioBtn"><i class="fa-solid fa-volume-high"></i> 웹 알림 소리 활성화</button>
      </div>

      <h2><i class="fa-solid fa-triangle-exclamation"></i> 긴급 센서</h2>
      <div id="mainContainer" class="sensor-main"></div>

      <h2><i class="fa-solid fa-user-check"></i> 검색 결과</h2>
      <div id="filteredContainer"></div>

      <h2><i class="fa-solid fa-clipboard-list"></i> 전체 센서</h2>
      <div class="sensor-wrapper">
        <div class="toggle-row">
          <button id="toggleButton">더보기 열기</button>
        </div>
        <div id="sensorContainer" class="sensor-container hidden"></div>
      </div>
    </div>
  </div>

  <!--  알림 사운드 -->
  <audio id="alertSoundTemplate" src="sounds/alert.mp3" preload="auto" style="display:none"></audio>

  <!--  메인 페이지 모듈 -->
  <script type="module" src="2025.6.16.js"></script>

  <!--  현재 시각 표시 -->
  <script>
    function updateDateTime() {
      const now = new Date();
      const formatted = now.toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
      document.getElementById('currentDateTime').textContent = `현재 시각: ${formatted}`;
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
